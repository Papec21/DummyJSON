$kind: http-request
url: https://dummyjson.com/products/add
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"id\": {{productId}},\r

    \    \"title\": \"avocado\",\r

    \    \"category\": \"groceries\",\r

    \    \"price\": 3.99\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response contains id, title, price and category", function() {
          const response = pm.response.json();
          pm.expect(response).to.have.property("price");
          pm.expect(response.id).to.be.a("number");
          pm.expect(response.category).to.be.a("string");
          pm.expect(response.title).to.be.a("string");
      })
    language: text/javascript
order: 10000
