$kind: http-request
name: Get Products Under 10$
url: https://dummyjson.com/products
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const maxPrice = 10;\r

      const response = pm.response.json();\r

      const cheapProducts = response.products.filter((product) => product.price < maxPrice);\r

      \r

      console.log(\"Products under 10$: \", cheapProducts);\r

      \r

      pm.test(\"There are products under $10\", function () {\r

      \    cheapProducts.forEach(product => {\r

      \        pm.expect(product.price).to.be.below(maxPrice);\r

      \    });\r

      });"
    language: text/javascript
order: 3463490155530784
