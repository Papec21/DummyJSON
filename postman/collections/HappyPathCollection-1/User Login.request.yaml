$kind: http-request
name: User Login
url: https://dummyjson.com/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"emilys\",\r

    \    \"password\": \"emilyspass\"\r

    }"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const authToken = pm.response.json().accessToken;\r

      \r

      pm.collectionVariables.set(\"authToken\", authToken);"
    language: text/javascript
order: 4000
