$kind: http-request
name: User Login
url: https://dummyjson.com/auth/login
method: POST
body:
  type: json
  content: "{\r

    \    \"username\": \"emilys\",\r

    \    \"password\": \"emilyspass\"\r

    }"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const authToken = pm.response.json().accessToken;\r

      \r

      pm.collectionVariables.set(\"authToken\", authToken);\r

      \r

      pm.test(\"Response contains token and user profile\", function() {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response).to.have.property(\"accessToken\");\r

      \    pm.expect(response.id).to.be.a(\"number\");\r

      \    pm.expect(response.username).to.be.a(\"string\");\r

      })"
    language: text/javascript
order: 4000
